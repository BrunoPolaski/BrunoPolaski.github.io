<!--
  EmailJS template for the portfolio contact form (components/folio/Contact.vue).
  Paste this into the template's HTML editor, then set in its settings:
    Subject:  {{subject}}
    To Email: polaskibruno03@gmail.com
    Reply To: {{reply_to}}
  Params sent by the form: subject, from_name, reply_to, message, locale, sent_at.
  Double braces are escaped by EmailJS, so visitor input can't inject HTML.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background:#f2f2f5; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#111118;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f5; padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e2e2e8;">
          <tr>
            <td style="background:#050507; padding:24px 28px;">
              <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#7a7aff; vertical-align:middle;"></span>
              <span style="margin-left:8px; color:#ffffff; font-size:13px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; vertical-align:middle;">Portfolio · new message</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px;">
              <p style="margin:0 0 4px; font-size:12px; color:#8a8a90; text-transform:uppercase; letter-spacing:0.08em;">From</p>
              <p style="margin:0; font-size:20px; font-weight:700;">{{from_name}}</p>
              <p style="margin:4px 0 0; font-size:14px;"><a href="mailto:{{reply_to}}" style="color:#5b5bd6; text-decoration:none;">{{reply_to}}</a></p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px;">
              <p style="margin:0 0 8px; font-size:12px; color:#8a8a90; text-transform:uppercase; letter-spacing:0.08em;">Message</p>
              <div style="padding:16px 18px; background:#f7f7fa; border-left:3px solid #7a7aff; border-radius:8px; font-size:15px; line-height:1.6; white-space:pre-wrap;">{{message}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;">
              <a href="mailto:{{reply_to}}?subject=Re:%20{{subject}}" style="display:inline-block; padding:12px 20px; background:#050507; color:#ffffff; border-radius:10px; font-size:14px; font-weight:600; text-decoration:none;">Reply to {{from_name}}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px; border-top:1px solid #ececf1; font-size:12px; color:#8a8a90;">
              Sent {{sent_at}} · site language: {{locale}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
