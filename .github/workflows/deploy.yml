name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # daily rebuild keeps the GitHub stats (repos, languages) fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm generate
        env:
          NITRO_PRESET: github_pages # adds .nojekyll so Pages serves the _nuxt/ folder
          NUXT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # contact form and WhatsApp links: repository variables (public anyway, they ship in the page)
          NUXT_PUBLIC_WHATSAPP: ${{ vars.NUXT_PUBLIC_WHATSAPP }}
          NUXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NUXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NUXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.NUXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NUXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NUXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
